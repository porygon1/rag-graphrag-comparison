[project]
name = "rag-graphrag-comparison"
version = "0.1.0"
description = "Code for comparing Vector RAG and Microsoft GraphRAG Local Search"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.1",
    "openai==2.52.0",
]

[project.optional-dependencies]
evaluation = ["matplotlib==3.10.6"]
pdf = ["pdfplumber==0.11.10"]
structure = [
    "docling-core==2.27.0",
    "semchunk==2.2.2",
    "transformers==4.57.6",
    "tiktoken==0.13.0",
    "spacy==3.8.14",
]
graphrag = [
    "graphrag==3.1.0",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "lancedb==0.24.3",
    "litellm==1.86.2",
    "tiktoken==0.13.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "jupyterlab==4.6.2",
    "nbclient==0.11.0",
    "pyright",
    "ruff",
    "tabulate==0.9.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_comparison"]

[tool.uv]
conflicts = [
    [{ extra = "pdf" }, { extra = "structure" }],
    [{ extra = "graphrag" }, { extra = "structure" }],
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
extraPaths = [".venv-structure/Lib/site-packages"]
