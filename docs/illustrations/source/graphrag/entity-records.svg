<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="48mm" viewBox="0 0 160 48" role="img" aria-labelledby="title desc"><title id="title">Entity records used in the example graph</title><desc id="desc">GUEST, GUIDE and DESK have types, descriptions and source links. GUIDE and GUEST refer to t1 and t4; DESK refers to t1. Each card keeps these properties together.</desc><defs><marker id="arrow" markerWidth="3" markerHeight="3" refX="2.8" refY="1.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L3 1.5L0 3Z" fill="#222"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#171717;font-size:3.881px}.small{font-size:3.704px}.bold{font-weight:700}.name{font-size:4.4px;font-weight:700}.process{fill:none;stroke:#222;stroke-width:.3;marker-end:url(#arrow)}.rule{fill:none;stroke:#999;stroke-width:.22}.edge{fill:none;stroke:#333;stroke-width:.3}.node{fill:white;stroke:#444;stroke-width:.27}.relation{fill:white;stroke:#888;stroke-width:.2}</style>
<g id="entity-cards" transform="translate(0,-30)">
<text x="2" y="34" class="bold">Entity records: name, type and description</text>
<g id="guest"><rect x="2" y="39" width="50" height="37" rx=".7" fill="white" stroke="#888" stroke-width=".22"/><path d="M5 48H49" class="rule"/><text x="5" y="44.5" class="name">GUEST</text><text x="5" y="54" class="small">Type: PERSON</text><text x="5" y="60.5">Person expected</text><text x="5" y="66.3">for a visit.</text><text x="5" y="72.5" class="small">Text units: t1, t4</text></g>
<g id="guide"><rect x="55" y="39" width="50" height="37" rx=".7" fill="white" stroke="#888" stroke-width=".22"/><path d="M58 48H102" class="rule"/><text x="58" y="44.5" class="name">GUIDE</text><text x="58" y="54" class="small">Type: PERSON</text><text x="58" y="60.5">Person who books</text><text x="58" y="66.3">and welcomes guests.</text><text x="58" y="72.5" class="small">Text units: t1, t4</text></g>
<g id="desk"><rect x="108" y="39" width="50" height="37" rx=".7" fill="white" stroke="#888" stroke-width=".22"/><path d="M111 48H155" class="rule"/><text x="111" y="44.5" class="name">DESK</text><text x="111" y="54" class="small">Type: ORGANIZATION</text><text x="111" y="60.5">Unit that processes</text><text x="111" y="66.3">guest bookings.</text><text x="111" y="72.5" class="small">Text unit: t1</text></g>
</g>
</svg>
