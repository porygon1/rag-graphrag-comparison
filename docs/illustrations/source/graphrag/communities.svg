<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="86mm" viewBox="0 0 160 86" role="img" aria-labelledby="title desc">
<title id="title">Community detection groups existing graph entities</title><desc id="desc">The known GUEST, GUIDE and DESK graph is reused. GraphRAG 3.1.0 applies hierarchical Leiden through graspologic_native. A labelled dashed boundary denotes one illustrative community C1 at one hierarchy level. The grouping is schematic, not a recorded G0 community.</desc>
<defs><marker id="arrow" markerWidth="3" markerHeight="3" refX="2.8" refY="1.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L3 1.5L0 3Z" fill="#222"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#171717;font-size:3.881px}.small{font-size:3.704px}.bold{font-weight:700}.process{fill:none;stroke:#222;stroke-width:.3;marker-end:url(#arrow)}.rule{fill:none;stroke:#999;stroke-width:.22}.edge{fill:none;stroke:#333;stroke-width:.3}.node{fill:white;stroke:#444;stroke-width:.27}.program{fill:#f2f2f2;stroke:#333;stroke-width:.28}</style>
<text x="2" y="5" class="bold">Entity graph from the previous page</text>
<g id="input-graph"><path class="edge" d="M38 15H63M97 15H120"/><rect x="2" y="10" width="36" height="10" rx="5" class="node"/><text x="20" y="16.5" text-anchor="middle" class="bold">GUEST</text><rect x="63" y="10" width="34" height="10" rx="5" class="node"/><text x="80" y="16.5" text-anchor="middle" class="bold">GUIDE</text><rect x="120" y="10" width="38" height="10" rx="5" class="node"/><text x="139" y="16.5" text-anchor="middle" class="bold">DESK</text></g>
<path class="rule" d="M2 22C2 24 4 24 6 24H74C78 24 80 25 80 27C80 25 82 24 86 24H154C156 24 158 24 158 22"/><path class="process" d="M80 27V30.8"/>
<g id="community-program"><rect class="program" x="44" y="31" width="72" height="15" rx="1.2"/><text x="80" y="37" text-anchor="middle" class="bold">Community detection</text><text x="80" y="43" text-anchor="middle" class="small">Hierarchical Leiden in GraphRAG 3.1.0</text></g>
<path class="process" d="M80 46V54.8"/>
<g id="illustrative-community"><rect x="2" y="55" width="156" height="28" rx="3" fill="none" stroke="#666" stroke-width=".25" stroke-dasharray="1.5 1.2"/><text x="7" y="62" class="bold">Community C1 (schematic)</text><path class="edge" d="M43 73H63M97 73H115"/><rect x="7" y="68" width="36" height="10" rx="5" class="node"/><text x="25" y="74.5" text-anchor="middle" class="bold">GUEST</text><rect x="63" y="68" width="34" height="10" rx="5" class="node"/><text x="80" y="74.5" text-anchor="middle" class="bold">GUIDE</text><rect x="115" y="68" width="38" height="10" rx="5" class="node"/><text x="134" y="74.5" text-anchor="middle" class="bold">DESK</text></g>
</svg>
