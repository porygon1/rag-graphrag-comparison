<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="71mm" viewBox="0 0 160 71" role="img">
<title>Parse the model response and attach the known input ID</title>
<desc>One constructed model response becomes named fields. The input text-unit ID is added by GraphRAG, not generated by the LLM.</desc>
<defs><marker id="arrow" markerWidth="3" markerHeight="3" refX="2.8" refY="1.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L3 1.5L0 3Z" fill="#222"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#171717;font-size:3.881px}.small{font-size:3.704px}.bold{font-weight:700}.process{fill:none;stroke:#222;stroke-width:.3;marker-end:url(#arrow)}.rule{fill:none;stroke:#999;stroke-width:.22}.edge{fill:none;stroke:#333;stroke-width:.3}.node{fill:white;stroke:#444;stroke-width:.27}.relation{fill:white;stroke:#888;stroke-width:.2}</style>
<rect x="2" y="0" width="156" height="17" rx="1" class="relation"/>
<text x="7" y="6" class="bold" text-anchor="start">Model output: one entity record</text>
<text x="7" y="13" class="" text-anchor="start">(&quot;entity&quot;&lt;|&gt;GUIDE&lt;|&gt;PERSON&lt;|&gt;Person who books guests.)</text>
<path class="process" d="M80 17V21.8"/>
<rect x="13" y="22" width="134" height="15" rx="1.2" fill="#f2f2f2" stroke="#333" stroke-width=".28"/>
<text x="18" y="28" class="bold" text-anchor="start">Parser (GraphRAG 3.1.0)</text>
<text x="18" y="34" class="small" text-anchor="start">GraphRAG reads the response into named fields.</text>
<path class="process" d="M80 37V41.8"/>
<rect x="2" y="42" width="156" height="27" rx="1" class="relation"/>
<text x="7" y="48" class="small" text-anchor="start">Title (entity name)</text>
<text x="53" y="48" class="small" text-anchor="start">Type</text>
<text x="93" y="48" class="small" text-anchor="start">Description</text>
<text x="7" y="55" class="bold" text-anchor="start">GUIDE</text>
<text x="53" y="55" class="bold" text-anchor="start">PERSON</text>
<text x="93" y="55" class="" text-anchor="start">Person who books</text>
<text x="93" y="61" class="" text-anchor="start">guests.</text>
<path class="rule" d="M7 63H153"/>
<text x="7" y="67" class="small" text-anchor="start">GraphRAG attaches the input text-unit ID t1 to this record.</text>
</svg>
