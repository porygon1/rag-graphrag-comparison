<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="60mm" viewBox="0 0 160 60" role="img" aria-labelledby="title desc"><title id="title">GraphRAG extraction prompt and text unit as separate LLM inputs</title><desc id="desc">The prompt shown is a summary of the default template, not a verbatim quotation. Within the same prompt document, a labelled task is separated from a shaded band listing the allowed entity types. These are the GraphRAG 3.1.0 defaults used by G0. Both belong to the extraction prompt. The LLM produces formatted text, illustrated in the next panel.</desc><defs><marker id="arrow" markerWidth="3" markerHeight="3" refX="2.8" refY="1.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L3 1.5L0 3Z" fill="#222"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#171717;font-size:3.881px}.small{font-size:3.704px}.bold{font-weight:700}.process{fill:none;stroke:#222;stroke-width:.3;marker-end:url(#arrow)}.rule{fill:none;stroke:#999;stroke-width:.22}.edge{fill:none;stroke:#333;stroke-width:.3}.node{fill:white;stroke:#444;stroke-width:.27}.relation{fill:white;stroke:#888;stroke-width:.2}</style>

<g id="prompt">
<path d="M2 3H95L100 8V56H2Z" fill="white" stroke="#555" stroke-width=".25"/>
<path d="M95 3V8H100" fill="#eee" stroke="#555" stroke-width=".25"/>
<rect x="2.125" y="40.5" width="97.75" height="15.375" fill="#f2f2f2"/>
<path class="rule" d="M2 40.5H100"/>
<text x="7" y="10" class="bold">GraphRAG extraction prompt</text>
<text x="7" y="16.5" class="small">Default template, v3.1.0 (summary)</text>
<text x="7" y="24" class="small bold">Task</text>
<text x="7" y="30">Identify and describe entities and relationships.</text>
<text x="7" y="36">Return the required record format.</text>
<text x="7" y="46" class="small bold">Allowed entity types (G0 defaults)</text>
<text x="7" y="52.5" class="small">PERSON, ORGANIZATION, GEO, EVENT</text>
<path class="process" d="M100 30H117.8"/>
</g>
<g id="text-input"><rect x="118" y="0" width="40" height="10" rx="1" class="relation"/><text x="138" y="6.5" text-anchor="middle" class="small">Text unit t1</text><path class="process" d="M138 10V19.8"/></g>
<g id="llm"><rect x="118" y="20" width="40" height="20" rx="3" fill="#f2f2f2" stroke="#333" stroke-width=".28"/>
<text x="138" y="27.5" text-anchor="middle" class="bold">Azure LLM</text>
<text x="138" y="34.5" text-anchor="middle" class="small">gpt-4.1-mini</text>
<path class="process" d="M138 40V48.8"/><rect x="118" y="49" width="40" height="9" rx="1" class="relation"/><text x="138" y="55" text-anchor="middle" class="small">Model output</text></g>
</svg>
