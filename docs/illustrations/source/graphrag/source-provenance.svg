<text x="27" y="53" class="" text-anchor="start">Record ID: 1</text>
<text x="27" y="60" class="" text-anchor="start">Text unit: t1</text>
<path d="M80 65V77" class="process"/>
<rect x="22" y="77" width="116" height="31" rx="2" class="module"/>
<text x="80" y="85" class="bold" text-anchor="middle">Source resolution (project)</text>
<text x="80" y="94" class="" text-anchor="middle">The project follows t1 to its input record</text>
