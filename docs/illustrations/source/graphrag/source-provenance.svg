<text x="7" y="16" class="" text-anchor="start">[Data: Sources (1)]</text>
<path d="M80 22V34" class="process"/>
<rect x="22" y="34" width="116" height="31" rx="1" class="paper"/>
<text x="27" y="42" class="bold" text-anchor="start">Sources record</text>
