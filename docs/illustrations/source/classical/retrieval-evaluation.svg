<text x="46" y="63" class="small bold" text-anchor="start">Page</text>
<text x="70" y="63" class="small bold" text-anchor="start">Content (shortened)</text>
<text x="147" y="63" class="small bold" text-anchor="middle">Qrel grade</text>
<rect x="2" y="67" width="156" height="65" rx="0" class="module"/>
<text x="10" y="76" class="small" text-anchor="middle">1</text>
<text x="25" y="76" class="small" text-anchor="start">c1</text>
<text x="46" y="76" class="small" text-anchor="start">A / 1</text>
<text x="70" y="74" class="small" text-anchor="start">Guide books and</text>
<text x="70" y="79" class="small" text-anchor="start">welcomes guests.</text>
<text x="147" y="76" class="bold" text-anchor="middle">2</text>
<path d="M7 82H153" class="rule"/>
