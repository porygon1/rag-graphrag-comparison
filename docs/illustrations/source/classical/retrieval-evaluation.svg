<text x="7" y="14" class="" text-anchor="start">c1, c3, c4, c2, c5</text>
<text x="7" y="20" class="small" text-anchor="start">Keep the retrieval order.</text>
<text x="92" y="7" class="bold" text-anchor="start">Reference evidence</text>
<text x="92" y="14" class="small" text-anchor="start">Page-level qrels and</text>
<text x="92" y="20" class="small" text-anchor="start">minimal evidence sets.</text>
<path d="M39.5 23V28.8" class="process"/>
<path d="M122.5 23V28.8" class="process"/>
<rect x="2" y="29" width="156" height="19" rx="3" class="module"/>
<text x="80" y="36" class="bold" text-anchor="middle">Retrieval evaluation (project)</text>
<text x="80" y="43" class="small" text-anchor="middle">Map each chunk to its page and attach the qrel grade.</text>
