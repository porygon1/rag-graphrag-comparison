<text x="70" y="127" class="small" text-anchor="start">via the repair desk.</text>
<text x="147" y="124" class="bold" text-anchor="middle">0</text>
<path d="M39.5 132V136.8" class="process"/>
<path d="M122.5 132V136.8" class="process"/>
<rect x="2" y="137" width="75" height="37" rx="1" class="paper"/>
<rect x="87" y="137" width="71" height="37" rx="1" class="paper"/>
<text x="7" y="145" class="bold" text-anchor="start">nDCG@5 = 0.866</text>
<text x="7" y="153" class="small" text-anchor="start">Grades: 2, 1, 2, 0, 0</text>
<text x="7" y="160" class="small" text-anchor="start">Ideal: 2, 2, 1, 1, 0</text>
<text x="7" y="168" class="small" text-anchor="start">DCG / IDCG: 3.631 / 4.193</text>
<text x="92" y="145" class="bold" text-anchor="start">Evidence Recall@5 = 1</text>
<text x="92" y="153" class="small" text-anchor="start">c1 covers both required facts:</text>
<text x="92" y="160" class="small" text-anchor="start">book and welcome guests.</text>
<text x="92" y="168" class="small" text-anchor="start">The set {A / 1} is complete.</text>
