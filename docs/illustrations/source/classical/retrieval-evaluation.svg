<text x="25" y="88" class="small" text-anchor="start">c3</text>
<text x="46" y="88" class="small" text-anchor="start">C / 2</text>
<text x="70" y="86" class="small" text-anchor="start">Guest badges must</text>
<text x="70" y="91" class="small" text-anchor="start">show the booked session.</text>
<text x="147" y="88" class="bold" text-anchor="middle">1</text>
